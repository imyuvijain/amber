[project]
name = "amber"
version = "0.1.0"
description = "Five yous compete to predict your clothing picks in a CLIP-style vector space."
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "open_clip_torch",
    "datasets",
    "pillow",
    "numpy",
    "pandas",
    "pyarrow",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "typer",
    "pyyaml",
]

[project.optional-dependencies]
llm = ["anthropic"]

[project.scripts]
amber = "amber.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amber"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
markers = ["slow: needs real model or network"]
addopts = "-m 'not slow'"

[project]
name = "amber"
version = "0.1.0"
description = "A personal decision engine trained on your own data exports."
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "open_clip_torch",
    "datasets",
    "pillow",
    "numpy",
    "pandas",
    "pyarrow",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "typer",
    "pyyaml",
    "scipy>=1.18.1",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
amber = "amber.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amber"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
markers = ["slow: needs real model or network"]
addopts = "-m 'not slow'"
